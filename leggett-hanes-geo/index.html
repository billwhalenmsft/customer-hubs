<script>
(function(){
  var P=JSON.parse(document.getElementById('hub-payload').textContent), SK='hubkey:'+location.pathname;
  function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
  async function open(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.v)},key,b(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close()}
  var saved=sessionStorage.getItem(SK); if(saved){open(saved).then(show).catch(function(){sessionStorage.removeItem(SK)})}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
    btn.disabled=true;btn.textContent='Opening…';err.textContent='';
    try{var html=await open(pw);if(document.getElementById('rem').checked)sessionStorage.setItem(SK,pw);show(html)}
    catch(x){err.textContent='That passphrase didn\'t work. Check it and try again.';btn.disabled=false;btn.textContent='Open hub'}
  });
})();
</script></body></html>
